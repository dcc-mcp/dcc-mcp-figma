[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-figma"
version = "0.1.0"
description = "Typed Figma Plugin API adapter using dcc-mcp-core"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"
dependencies = ["dcc-mcp-core>=0.20.44,<0.21"]

[project.optional-dependencies]
trial = ["mcp>=1.27,<2; python_version>='3.10'"]
test = ["pytest>=7,<10", "mcp>=1.27,<2; python_version>='3.10'"]

[project.scripts]
dcc-mcp-figma = "dcc_mcp_figma.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_figma"]

[tool.hatch.build.targets.wheel.force-include]
"plugin/blueprint.js" = "dcc_mcp_figma/plugin/blueprint.js"
"plugin/runtime.js" = "dcc_mcp_figma/plugin/runtime.js"
"plugin/main.js" = "dcc_mcp_figma/plugin/main.js"
"plugin/ui.html" = "dcc_mcp_figma/plugin/ui.html"
"plugin/manifest.template.json" = "dcc_mcp_figma/plugin/manifest.template.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py37"
